name: Pylint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # One pinned interpreter + the full dependency set: pylint infers members of installed
    # packages, so the result must not depend on which optional extras are present.
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,test,full]"

    - name: Run pylint (zero messages required)
      run: pylint h2kvm/
